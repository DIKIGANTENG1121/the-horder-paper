name: Build HordesPaper 26.3 JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build HordesPaper and NeonTestKit JARs
        run: gradle build :neon-testkit:build --no-daemon

      - name: Upload HordesPaper JAR
        uses: actions/upload-artifact@v4
        with:
          name: HordesPaper-26.3-JAR
          path: |
            build/libs/HordesPaper-*.jar
            neon-testkit/build/libs/neon-testkit-*.jar
