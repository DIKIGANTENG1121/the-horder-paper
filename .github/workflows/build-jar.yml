name: Build HordesPaper 26.3 JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle build :neon-testkit:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HordesPaper-26.3-JAR
          path: |
            build/libs/HordesPaper-*.jar
            neon-testkit/build/libs/neon-testkit-*.jar
